name: AGC8F host regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        # Runtime pins from requirements.txt; jsonschema is the optional structured-output validator.
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3 regex==2026.9.10 jsonschema==4.25.1
      - name: Service regressions (mock engines, no GPU)
        run: python -m unittest discover -s serve -t . -p 'test_*.py'
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build-agc8f-host -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF -DSTRATA_BUILD_AGC8F_TESTS=ON
      - name: Build
        run: cmake --build build-agc8f-host --target prefill_pipeline_test prefill_audit_test mtp_prefill_audit_test callback_probe_test boundary_probe_test plan_trace_test stage_dense_scope_test -j 2
      - name: Test
        run: ctest --test-dir build-agc8f-host -R '^(prefill_(pipeline|audit)|mtp_prefill_audit|stage_dense_scope)_test$|^(callback_probe|boundary_probe|plan_trace)_' --output-on-failure
      - name: Expert parallel host and sanitizer regressions
        run: |
          python3 tools/agc8f/test_ep_remote.py
          python3 tools/agc8f/test_ep_split.py
          python3 tools/agc8f/test_ep_sequence.py
          python3 tools/agc8f/test_ep_native_reset.py
          python3 tools/agc8f/test_ep_dispatch.py
          python3 tools/agc8f/test_ep_prefill_flow.py
          python3 tools/agc8f/test_ep_host_policy.py
          python3 tools/agc8f/test_ep_publication.py
